name: Build release draft

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2
      - name: Check release tag
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            throw 'Release tag does not match package.json'
          }
      - run: node --test
      - name: Build portable packages and source
        run: node scripts/package.mjs --target all --source
      - name: Build standalone Windows executable
        run: node scripts/build-executable.mjs
      - name: Checksums for all downloadable files
        shell: pwsh
        run: |
          $lines = Get-ChildItem -LiteralPath dist -File |
            Where-Object Name -ne 'SHA256SUMS.txt' |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          [IO.File]::WriteAllText((Join-Path $PWD 'dist/SHA256SUMS.txt'), ($lines -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error

  macos:
    name: Build and verify macOS ${{ matrix.arch }} app
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2
      - name: Test launcher logic on macOS
        run: node --test
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-files
          path: release-files
      - name: Verify the actual downloadable macOS package
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")"
          test "$(node -p process.arch)" = "$PACKAGE_ARCH"
          archive="codex-speed-launcher-$version-darwin-$PACKAGE_ARCH.zip"
          (cd release-files && shasum -a 256 --check SHA256SUMS.txt)
          folder="$RUNNER_TEMP/portable package with spaces"
          mkdir -p "$folder"
          ditto -x -k "release-files/$archive" "$folder"
          package="$folder/${archive%.zip}"
          node scripts/package.mjs --verify-dir "$package"
          test -x "$package/runtime/node"
          test -x "$package/inspect-macos.command"
          test -x "$package/launch-macos.command"
          bash -n "$package/inspect-macos.command" "$package/launch-macos.command"
          test "$("$package/runtime/node" --version)" = 'v24.22.2'
          test "$("$package/runtime/node" "$package/src/cli.mjs" --version)" = "$version"
          for entry in inspect-macos.command launch-macos.command; do
            output="$(printf '\n' | env PATH=/usr/bin:/bin:/usr/sbin:/sbin "$package/$entry" --help)"
            printf '%s\n' "$output"
            grep -F "Codex Speed Launcher $version" <<< "$output"
          done
          node scripts/build-macos-app.mjs --package-dir "$package" --arch "$PACKAGE_ARCH" --out app-files --work "$RUNNER_TEMP/macos-app-build"
          mkdir -p "$RUNNER_TEMP/final app with spaces"
          ditto -x -k "app-files/codex-speed-launcher-$version-darwin-$PACKAGE_ARCH-app.zip" "$RUNNER_TEMP/final app with spaces"
          app="$RUNNER_TEMP/final app with spaces/Codex Speed Launcher.app"
          codesign --verify --deep --strict "$app"
          plutil -lint "$app/Contents/Info.plist"
          node scripts/package.mjs --verify-dir "$app/Contents/Resources/launcher"
          test "$("$app/Contents/Resources/launcher/runtime/node" --version)" = 'v24.22.2'
          mkdir -p validation
          "$app/Contents/MacOS/CodexSpeedLauncher" --self-test "$PWD/validation/report.json"
          node -e 'const r=require("./validation/report.json"); if(r.ok!==true) process.exit(1); console.log(JSON.stringify(r))'
          test -s validation/window.png
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-app-${{ matrix.arch }}
          path: app-files/*
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: macos-validation-${{ matrix.arch }}
          path: validation/*
          if-no-files-found: warn

  draft:
    if: github.ref_type == 'tag'
    needs: [build, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-files
          path: release-files
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: macos-app-*
          merge-multiple: true
          path: release-files
      - name: Generate checksums for all public downloads
        working-directory: release-files
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | xargs -d '\n' sha256sum > SHA256SUMS.txt
      - name: Create draft with downloadable assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" release-files/* --verify-tag --draft --generate-notes --title "$RELEASE_TAG"
