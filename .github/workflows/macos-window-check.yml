name: Check native macOS window

on:
  workflow_dispatch:
    inputs:
      portable_run:
        description: Successful Windows portable build run to reuse
        required: true
        default: '43381234575'

permissions:
  contents: read
  actions: read

jobs:
  window:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            arch: arm64
          - os: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24.22.2
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: release-files
          run-id: ${{ inputs.portable_run }}
          github-token: ${{ github.token }}
          path: portable-files
      - name: Compile latest native window against the verified runtime
        timeout-minutes: 4
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")"
          mkdir -p "$RUNNER_TEMP/portable"
          ditto -x -k "portable-files/codex-speed-launcher-$version-darwin-$PACKAGE_ARCH.zip" "$RUNNER_TEMP/portable"
          node scripts/build-macos-app.mjs --package-dir "$RUNNER_TEMP/portable/codex-speed-launcher-$version-darwin-$PACKAGE_ARCH" --arch "$PACKAGE_ARCH" --out app-files --work "$RUNNER_TEMP/mac-window-build"
      - name: Check native AppKit window and controller actions
        timeout-minutes: 2
        env:
          PACKAGE_ARCH: ${{ matrix.arch }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")"
          mkdir -p "$RUNNER_TEMP/final app" validation
          ditto -x -k "app-files/codex-speed-launcher-$version-darwin-$PACKAGE_ARCH-app.zip" "$RUNNER_TEMP/final app"
          "$RUNNER_TEMP/final app/Codex Speed Launcher.app/Contents/MacOS/CodexSpeedLauncher" --self-test "$PWD/validation/report.json"
          node -e 'const r=require("./validation/report.json");if(r.ok!==true)process.exit(1);console.log(JSON.stringify(r))'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: native-window-${{ matrix.arch }}
          path: validation/*
          if-no-files-found: warn
